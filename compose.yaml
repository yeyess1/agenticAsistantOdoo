# Odoo 19 agentic RAG - Docker Compose (D-10).
# Services: postgres, qdrant, embeddings (TEI), init, ingestion, agent, frontend.
# `docker compose up` brings everything up; the UI is http://127.0.0.1:3000 (only port
# published by the base file). The eval runner is the `eval` profile (`make eval`).
# Secrets live in .env (never here). `${VAR:-x}` defaults are dev-only.
name: odoo-rag

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo_rag} # dev-only default
      POSTGRES_DB: ${POSTGRES_DB:-odoo_rag} # dev-only default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image may not ship curl/wget (V-e): plain HTTP GET over bash /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && read -r line <&3 && [[ "$$line" == *" 200"* ]]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  embeddings:
    # CPU image by default (RK-01); the GPU variant lives in compose.gpu.yaml.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    restart: unless-stopped
    command:
      - --model-id
      - ${EMBEDDINGS_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --port
      - "80"
      # Default 16384 batch tokens OOM-kills TEI on CPU during warm-up (~12 GB RSS,
      # attention is quadratic). Chunks are ~512 tokens (D-06); 4096 leaves room for
      # long uncut code blocks.
      - --max-batch-tokens
      - "4096"
      # Qwen3 max_input_length (32768) > --max-batch-tokens: TEI refuses to start
      # without truncation. Only inputs above 4096 tokens are truncated.
      - --auto-truncate
    environment:
      # Passed through only if set in .env (an empty token must not reach TEI).
      - HF_TOKEN
    volumes:
      - hf-cache:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && read -r line <&3 && [[ "$$line" == *" 200"* ]]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s # first start downloads the model

  init:
    # One-shot: Postgres tables + checkpointer + Qdrant collection and payload indexes (C-04).
    build:
      context: ./infra/init
      additional_contexts:
        common: ./packages/common
        workspace: .
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  ingestion:
    # Upload / list / delete documents; parsing, chunking, embeddings, Qdrant upsert (I-01…I-07).
    build:
      context: ./services/ingestion
      additional_contexts:
        common: ./packages/common
        workspace: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Writable cache for the Qwen3 tokenizer (downloaded once from Hugging Face).
      TOKENIZER_CACHE_DIR: /data/documents/tokenizers
    volumes:
      - documents-data:/data/documents
      - ./data/corpus:/data/corpus:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      init:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  agent:
    # LangGraph supervisor: /query, /query/stream (SSE), /query/resume, /search, /health.
    build:
      context: ./services/agent
      additional_contexts:
        common: ./packages/common
        workspace: .
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    # Next.js standalone (U-13). Same-origin proxy /api/agent/* and /api/ingestion/* (§5.4).
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      AGENT_URL: ${AGENT_URL:-http://agent:8000}
      INGESTION_URL: ${INGESTION_URL:-http://ingestion:8001}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000" # host port configurable (C-03 side-by-side test)
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      agent:
        condition: service_healthy
      ingestion:
        condition: service_healthy

  eval:
    # Evaluation runner (Phase 4, E-13): only with `--profile eval` (`make eval`). Runs in
    # the internal network (agent, Qdrant and TEI are not published by the base file).
    profiles: [eval]
    build:
      context: ./eval
      additional_contexts:
        common: ./packages/common
        workspace: .
    env_file: .env
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
    # Writes to the ./eval/reports bind mount: run as the host user (dev-only default 1000).
    user: "${EVAL_UID:-1000}:${EVAL_GID:-1000}"
    volumes:
      - ./eval/reports:/app/eval/reports
    restart: "no"
    depends_on:
      agent:
        condition: service_healthy

volumes:
  pg-data:
  qdrant-data:
  hf-cache:
  documents-data:
