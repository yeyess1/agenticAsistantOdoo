# Dev override, loaded automatically by `docker compose`.
# Qdrant and the ingestion/agent APIs (curl, Swagger at /docs) on loopback only.
# `develop.watch` for agent/ingestion/frontend arrives in Phase 3 (C-06).
services:
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
  ingestion:
    ports:
      - "127.0.0.1:8001:8001"
  agent:
    ports:
      - "127.0.0.1:8000:8000"
