[project]
name = "odoo-rag-init"
version = "0.1.0"
description = "One-shot bootstrap: Postgres migrations + checkpointer tables + Qdrant collection and payload indexes"
requires-python = ">=3.12"
dependencies = [
    "odoo-rag-common",
    "langgraph-checkpoint-postgres>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bootstrap.py"]
