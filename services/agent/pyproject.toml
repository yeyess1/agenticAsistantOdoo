[project]
name = "odoo-rag-agent"
version = "0.1.0"
description = "Agent service (FastAPI + LangGraph): /search now, graph in Phases 2-3."
requires-python = ">=3.12"
dependencies = [
    "odoo-rag-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
