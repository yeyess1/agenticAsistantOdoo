[project]
name = "odoo-rag-ingestion"
version = "0.1.0"
description = "Ingestion service (FastAPI). Skeleton: implemented in Phase 1."
requires-python = ">=3.12"
dependencies = [
    "odoo-rag-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
