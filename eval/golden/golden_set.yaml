# Golden set (E-01, D-12; schema in docs/ARCHITECTURE.md §12)
#
# Corpus: data/corpus/odoo19-dev (58 Odoo 19 Developer pages + coding_guidelines.pdf).
# Questions in Spanish (as users will write them), corpus in English. `question_en` is a
# faithful manual translation used by E-09 (ES vs EN retrieval).
#
# Categories (31 items):
#   covered       17  q01-q17  answerable from the corpus -> expected_agent: docs
#                              - most span 3-6 sections across 2-4 documents, so recall@k
#                                can be contrasted over all the important chunks
#                              - q11 (PDF) and q12 are single-section precise questions
#                              - q05, q11, q14 target the coding guidelines PDF
#                              - q15-q17 use colloquial Spanish that maps poorly to the
#                                English docs (expects_rewrite: true)
#   not_covered    6  q18-q23  the corpus does not answer them (grep evidence in notes)
#                              -> expected_agent: research (Odoo Forum search)
#   out_of_scope   4  q24-q27  greeting / non-Odoo requests -> expected_agent: direct
#   follow_up      4  q28-q31  2 threads x 2 turns; turn 2 is unanswerable without turn 1
#                              (contextualize must rewrite it) -> expected_agent: docs
#
# relevant_sections (section level, D-12):
#   - Web pages: `<frontmatter url>#<anchor>`; every anchor exists verbatim as `{#anchor}`
#     on a heading of that file. H1-H3 anchors are preferred; H4 anchors are used when the
#     H3 above is very large (e.g. ORM "Fields") because the chunker moves the chunk anchor
#     to H4+ headings, so a chunk's payload `anchor` can be an H4 id.
#   - PDF: ingestion stores the PDF chunks with url = "coding_guidelines.pdf" (seed sends no
#     source_url, no anchor for non-web sources) and `page` = N. They are written here as
#     `coding_guidelines.pdf#page=N`; the eval loader must match them on (url, page).
#     Canonical page: https://www.odoo.com/documentation/19.0/contributing/development/coding_guidelines.html
#   - Empty for not_covered and out_of_scope.
#
# expected_answer: Spanish, concise, only facts stated in the cited sections. For
# not_covered it describes what a good answer must do; for out_of_scope, the expected
# behaviour of direct_answer.
#
# Optional fields: `thread` / `turn` only on follow_up items. `notes` explains what each
# item tests.

items:
  # ---------------------------------------------------------------- covered
  - id: q01
    category: covered
    question: >-
      ¿Cómo defino un campo calculado en Odoo 19 que dependa de otros campos (incluso de un
      campo de un registro relacionado), que se pueda editar a mano y por el que se pueda
      buscar o agrupar?
    question_en: >-
      How do I define a computed field in Odoo 19 that depends on other fields (even a field
      of a related record), that can be edited manually and that can be searched or grouped by?
    expected_answer: >-
      Se declara el campo con `compute='_compute_x'` y un método que asigna el valor a cada
      registro de `self` (un recordset). Las dependencias se declaran con `@api.depends(...)`,
      que admite rutas con punto como `partner_id.name` o `line_ids.value`; el ORM las usa para
      recalcular. Los campos calculados son de solo lectura y no se almacenan por defecto: para
      poder editarlos se define `inverse='_inverse_x'` (se ejecuta al guardar y escribe las
      dependencias); para buscar sin almacenar se define `search='_search_x'` que devuelve un
      dominio; con `store=True` se guardan en base de datos y habilitan búsqueda y agrupación,
      con el coste de recalcular todos los registros afectados cuando cambia una dependencia.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/08_compute_onchange.html#computed-fields
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/08_compute_onchange.html#dependencies
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/08_compute_onchange.html#inverse-function
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/08_compute_onchange.html#additional-information
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html#computed-fields
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Multi-faceted backend question: tutorial chapter 8 + ORM reference. Tests that the
      retriever brings both the tutorial and the reference chunks (compute, depends, inverse,
      search, store).

  - id: q02
    category: covered
    question: >-
      Tengo una app multiempresa: ¿cómo hago que cada usuario solo vea los registros de las
      compañías a las que tiene acceso, y cómo se combinan esas reglas con las reglas por grupo?
    question_en: >-
      I have a multi-company app: how do I make each user see only the records of the
      companies they have access to, and how do those rules combine with group rules?
    expected_answer: >-
      Con reglas de registro (`ir.rule`) basadas en `company_ids` (todas las compañías a las
      que el usuario tiene acceso) o `company_id` (la compañía activa), por ejemplo
      `domain_force` = `['|', ('company_id', '=', False), ('company_id', 'in', company_ids)]`
      para registros compartibles o `[('company_id', 'in', company_ids)]` para registros
      restringidos. Las reglas multiempresa suelen ser globales (sin `groups`), porque si no
      otras reglas podrían saltárselas. Las reglas globales se intersectan (todas deben
      cumplirse), las de grupo se unen (basta una) y ambos conjuntos se intersectan entre sí.
      Las reglas son default-allow: si ninguna aplica, se concede el acceso.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/tutorials/restrict_data_access.html#multi-company-security
      - https://www.odoo.com/documentation/19.0/developer/tutorials/restrict_data_access.html#record-rules
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/security.html#record-rules
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/security.html#global-rules-versus-group-rules
      - https://www.odoo.com/documentation/19.0/developer/howtos/company.html#security-rules
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Security reference + restrict_data_access tutorial + multi-company how-to (3 docs).
      Requires combining the multi-company domain with global vs group rule semantics.

  - id: q03
    category: covered
    question: >-
      ¿Qué necesito para crear un reporte PDF de mi modelo que aparezca en el menú Imprimir, y
      cómo le cambio el formato de papel?
    question_en: >-
      What do I need to create a PDF report for my model that shows up in the Print menu, and
      how do I change its paper format?
    expected_answer: >-
      Dos piezas, normalmente en archivos separados de la carpeta `report/` y declarados en
      `data` del manifiesto: una plantilla QWeb y una acción `ir.actions.report`. La plantilla
      mínima usa `t-call="web.html_container"`, recorre `docs` con `t-foreach` y llama a
      `web.external_layout` (cabecera y pie por defecto); el cuerpo va dentro de
      `<div class="page">`. La acción define `model`, `report_type` (`qweb-pdf` por defecto),
      `report_name` (id externo de la plantilla) y, para salir en el menú Imprimir,
      `binding_model_id`. El formato de papel es un registro `report.paperformat` (format, dpi,
      márgenes, orientación…) que se asigna con `paperformat_id`; si no se indica se usa el de
      la compañía.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/tutorials/pdf_reports.html#file-structure
      - https://www.odoo.com/documentation/19.0/developer/tutorials/pdf_reports.html#minimal-template
      - https://www.odoo.com/documentation/19.0/developer/tutorials/pdf_reports.html#report-action
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/reports.html#minimal-viable-template
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/reports.html#paper-format
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/actions.html#report-actions-ir-actions-report
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Reports reference + pdf_reports tutorial + actions reference (3 docs, 6 sections). Good
      for contrasting recall@k: the answer needs template, action and paper format chunks.

  - id: q04
    category: covered
    question: >-
      Quiero un widget de campo propio en OWL para usarlo en una vista de formulario con
      `widget="..."`. ¿Cómo lo creo, cómo lo registro y dónde declaro sus archivos JS y XML?
    question_en: >-
      I want my own OWL field widget to use in a form view with `widget="..."`. How do I
      create it, how do I register it and where do I declare its JS and XML files?
    expected_answer: >-
      Se crea un componente OWL (o se extiende uno existente como `BooleanField`, heredando su
      plantilla con `t-inherit` y `xpath`) con `static props = { ...standardFieldProps }`, que
      aporta props como `update`, `readonly` o el tipo de campo, y `static supportedTypes`.
      Se registra en la categoría `fields` del registro: `registry.category("fields").add(
      "my_text_field", MyTextField)`, lo que mapea el nombre del widget en la arquitectura al
      componente, y se usa con `<field name="..." widget="my_text_field"/>`. Los archivos
      `.js`, `.xml` (plantilla) y opcionalmente `.scss` del componente se añaden a un bundle de
      assets en la clave `assets` del `__manifest__.py`, típicamente `web.assets_backend`.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/howtos/javascript_field.html#create-a-new-field-component
      - https://www.odoo.com/documentation/19.0/developer/howtos/javascript_field.html#subclass-an-existing-field-component
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/registries.html#registries
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/owl_components.html#using-owl-components
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/assets.html#bundles
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Frontend: javascript_field how-to + registries + owl_components + assets (4 docs). Tests
      cross-document assembly of a full recipe.

  - id: q05
    category: covered
    question: >-
      ¿Cómo agrego un campo nuevo a una vista de formulario de otro módulo sin tocar su XML, y
      cómo debería nombrar el registro de la vista heredada?
    question_en: >-
      How do I add a new field to another module's form view without touching its XML, and how
      should I name the inherited view record?
    expected_answer: >-
      Con herencia de vistas: se crea un `ir.ui.view` con `inherit_id` apuntando a la vista
      padre y en `arch` elementos `xpath` con `expr` (expresión XPath que selecciona el nodo) y
      `position` (`inside` por defecto, `after`, `before`, `replace`, `attributes`, `move`),
      p. ej. `<xpath expr="//field[@name='description']" position="after">`. También se puede
      usar directamente `<field name="description" position="after">`. Las vistas de extensión
      se aplican sobre la vista primaria en orden de `priority`. Según las coding guidelines,
      el XML id de la vista heredada debe ser el mismo que el de la original y su `name` debe
      llevar el sufijo `.inherit.{details}`.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/12_inheritance.html#view-inheritance
      - https://www.odoo.com/documentation/19.0/developer/reference/user_interface/view_records.html#inheritance
      - https://www.odoo.com/documentation/19.0/developer/reference/user_interface/view_records.html#inheritance-specs
      - https://www.odoo.com/documentation/19.0/developer/reference/user_interface/view_records.html#inheritance-position
      - coding_guidelines.pdf#page=8
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      UI: inheritance tutorial + view_records reference + coding guidelines PDF ("Inheriting
      XML", page 8). Mixes web and PDF chunks in the same answer.

  - id: q06
    category: covered
    question: >-
      ¿Cómo escribo pruebas unitarias en Python para mi módulo y cómo ejecuto solo una clase o
      un método de test desde la línea de comandos?
    question_en: >-
      How do I write Python unit tests for my module and how do I run only one test class or
      test method from the command line?
    expected_answer: >-
      Se crea el subpaquete `tests/` con archivos `test_*.py` importados en `tests/__init__.py`
      (los no importados no se ejecutan). Las clases extienden `TransactionCase` (cada método
      corre en una subtransacción con savepoint que no se confirma) y el setup común va en
      `setUpClass`; no se debe llamar `cr.commit`. Los tests se ejecutan al instalar o
      actualizar módulos con `--test-enable`. `--test-tags` (implica `--test-enable`) filtra
      con el formato `[-][tag][/module][:class][.method]`, p. ej.
      `--test-tags=/account:TestAccountMove.test_custom_currency_on_account_1`; también existe
      `--test-file`. El decorador `@tagged` (solo en clases) añade o quita tags como `standard`,
      `at_install` o `post_install`.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/testing.html#testing-python-code
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/testing.html#running-tests
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/testing.html#test-selection
      - https://www.odoo.com/documentation/19.0/developer/tutorials/unit_tests.html#running-tests
      - https://www.odoo.com/documentation/19.0/developer/tutorials/unit_tests.html#writing-a-test
      - https://www.odoo.com/documentation/19.0/developer/reference/cli.html#testing
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Testing reference + unit_tests tutorial + CLI reference (3 docs, 6 sections). Same
      anchor `running-tests` in two documents: checks that url#anchor is compared as a whole.

  - id: q07
    category: covered
    question: >-
      Tengo una integración que usa XML-RPC con `execute_kw`. ¿Qué cambia si la paso a la nueva
      API JSON-2 de Odoo 19 y hasta cuándo seguirá funcionando XML-RPC?
    question_en: >-
      I have an integration that uses XML-RPC with `execute_kw`. What changes if I move it to
      the new Odoo 19 JSON-2 API, and until when will XML-RPC keep working?
    expected_answer: >-
      Los endpoints `/xmlrpc`, `/xmlrpc/2` y `/jsonrpc` están obsoletos desde 19.0 y está
      previsto retirarlos en Odoo 22 (otoño 2028) / Odoo Online 21.1 (invierno 2027). En
      XML-RPC `execute_kw` recibe base de datos, uid, contraseña, modelo, método, args y kwargs
      en cada llamada. En JSON-2 se hace un POST a `/json/2/<model>/<method>` con un cuerpo
      JSON (`ids`, `context` y los parámetros por nombre); la autenticación usa una API key en
      la cabecera `Authorization: bearer ...` en lugar de usuario/contraseña, y la base de
      datos solo se indica (cabecera `X-Odoo-Database`) cuando hay varias para un mismo
      dominio. La API key se crea en Preferencias ‣ Seguridad de la cuenta ‣ Nueva API key.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/external_api.html#migrating-from-xml-rpc-json-rpc
      - https://www.odoo.com/documentation/19.0/developer/reference/external_api.html#object-service
      - https://www.odoo.com/documentation/19.0/developer/reference/external_api.html#request
      - https://www.odoo.com/documentation/19.0/developer/reference/external_api.html#api-keys
      - https://www.odoo.com/documentation/19.0/developer/reference/external_rpc_api.html#external-rpc-api
      - https://www.odoo.com/documentation/19.0/developer/reference/external_rpc_api.html#calling-methods
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      JSON-2 API vs RPC API (2 docs). Tests version-specific facts (deprecation dates) and the
      contrast between the two authentication schemes.

  - id: q08
    category: covered
    question: >-
      En una nueva versión de mi módulo renombré un campo. ¿Cómo escribo el script de
      migración para que no se pierdan los datos ni se rompan filtros o acciones que lo usan?
    question_en: >-
      In a new version of my module I renamed a field. How do I write the upgrade script so
      that data is not lost and filters or actions that use it don't break?
    expected_answer: >-
      Se crea un script de upgrade: un archivo Python con una función `migrate(cr, version)`
      en `$module/migrations/$version/` (o `upgrades/`, nombre preferido) con prefijo `pre-`,
      `post-` o `end-`; `$version` incluye la versión mayor de Odoo y la del módulo y debe ser
      mayor que la instalada. Solo se ejecuta al actualizar el módulo; las fases son pre (antes
      de cargar el módulo), post (tras cargarlo y actualizarlo) y end (tras todos los
      módulos), y dentro de cada fase en orden léxico. Con upgrade utils
      (`from odoo.upgrade import util`) se usa `util.rename_field(cr, model, old, new)`, que
      renombra el campo en los modelos que heredan y actualiza referencias directas e
      indirectas (filtros, acciones de servidor, campos related, dominios…). Las operaciones
      sobre campos conviene hacerlas en scripts `pre-`.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_scripts.html#upgrade-scripts
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_scripts.html#writing-upgrade-scripts
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_scripts.html#phases-of-upgrade-scripts
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_utils.html#using-upgrade-utils
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_utils.html#module-odoo.upgrade.util.fields
      - https://www.odoo.com/documentation/19.0/developer/reference/upgrades/upgrade_utils.html#odoo.upgrade.util.fields.rename_field
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      upgrade_scripts + upgrade_utils (2 docs, 6 sections). Module-level upgrades ARE covered;
      contrast with q19 (database migration with OpenUpgrade), which is not.

  - id: q09
    category: covered
    question: >-
      Voy a empezar un módulo desde cero: ¿qué comandos de odoo-bin uso para generar su
      estructura base, crear una base de datos nueva, instalar el módulo y abrir una consola
      Python con acceso al ORM?
    question_en: >-
      I'm starting a module from scratch: which odoo-bin commands do I use to generate its base
      structure, create a new database, install the module and open a Python console with
      access to the ORM?
    expected_answer: >-
      `odoo-bin scaffold my_module /addons/` crea el esqueleto del módulo (nombre obligatorio,
      destino por defecto el directorio actual, `-t` para una plantilla propia); un módulo
      necesita al menos `__manifest__.py` e `__init__.py`. `odoo-bin db init <database>` crea
      la base e instala `base` (opciones `--with-demo`, `--force`, `--country`, `--language`,
      `--username`, `--password`). `odoo-bin module install <modules>` instala módulos en una
      base ya inicializada. `odoo-bin shell` abre una consola con `env` disponible; por
      defecto los cambios se revierten al salir salvo que se llame `env.cr.commit()`
      (`--shell-interface` elige ipython, ptpython, bpython o python).
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/cli.html#scaffold-scaffold-a-module
      - https://www.odoo.com/documentation/19.0/developer/reference/cli.html#db-init-initialize-a-database
      - https://www.odoo.com/documentation/19.0/developer/reference/cli.html#module-install-install-modules
      - https://www.odoo.com/documentation/19.0/developer/reference/cli.html#shell-open-a-shell
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/02_newapp.html#prepare-the-addon-directory
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      CLI reference (large page, 188 anchors) + tutorial chapter 2. Tests retrieval of several
      distant sections of the same big document.

  - id: q10
    category: covered
    question: >-
      ¿Cómo declaro en Odoo 19 una restricción SQL (por ejemplo, precio > 0) y cuándo me
      conviene más una restricción en Python con `@api.constrains`?
    question_en: >-
      How do I declare an SQL constraint in Odoo 19 (for example, price > 0) and when is a
      Python constraint with `@api.constrains` a better fit?
    expected_answer: >-
      Desde 18.1 las restricciones e índices se declaran como atributos del modelo cuyo nombre
      empieza por `_`: `_check_price = models.Constraint('CHECK(price > 0)', 'mensaje')`
      (también `models.Index` y `models.UniqueIndex`); el mensaje puede ser un texto o una
      función `(env, diag)`. Si hay datos que la violan, no se puede añadir la restricción. Las
      restricciones Python son métodos decorados con `@api.constrains('campo', ...)` que lanzan
      `ValidationError`; sirven para comprobaciones complejas, solo aceptan nombres simples de
      campo (no rutas con punto) y solo se disparan si esos campos están en el `create`/`write`.
      Las SQL suelen ser más eficientes, así que se prefieren cuando importa el rendimiento.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/10_constraints.html#sql
      - https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/10_constraints.html#python
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html#constraints-and-indexes
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html#odoo.api.constrains
      - https://www.odoo.com/documentation/19.0/developer/reference/backend/orm/changelog.html#odoo-online-version-18-1
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Tutorial chapter 10 + ORM reference + ORM changelog (3 docs). Version-sensitive: the
      model would tend to answer with the pre-18 `_sql_constraints` list, which the docs no
      longer describe; faithfulness should catch it.

  - id: q11
    category: covered
    question: >-
      Según las guías de código de Odoo, ¿en qué orden deben ir los atributos y métodos dentro
      de una clase de modelo?
    question_en: >-
      According to Odoo's coding guidelines, in what order should attributes and methods go
      inside a model class?
    expected_answer: >-
      1) atributos privados (`_name`, `_description`, `_inherit`…); 2) método por defecto y
      `default_get`; 3) declaración de campos; 4) restricciones SQL e índices; 5) métodos
      compute, inverse y search en el mismo orden que los campos; 6) métodos de selección;
      7) métodos `@api.constrains` y `@api.onchange`; 8) métodos CRUD (overrides del ORM);
      9) métodos de acción; 10) por último, otros métodos de negocio.
    relevant_sections:
      - coding_guidelines.pdf#page=20
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Single-section precise question that only the PDF answers (page 20). Tests PDF ingestion
      and the `p. N` citation format.

  - id: q12
    category: covered
    question: >-
      Con la API JSON-2, ¿puedo hacer varias llamadas seguidas dentro de una misma
      transacción para que se reviertan todas si una falla?
    question_en: >-
      With the JSON-2 API, can I make several consecutive calls inside the same transaction so
      that they all roll back if one fails?
    expected_answer: >-
      No. Cada llamada al endpoint JSON-2 corre en su propia transacción SQL: se confirma si
      tiene éxito y se descarta si hay error, y no es posible encadenar varias llamadas en una
      sola transacción. La solución es llamar a un único método que haga todas las operaciones
      relacionadas (como `search_read`, o métodos `action_` como `action_confirm` de
      `sale.order`); si no existe, se puede crear uno en un módulo dedicado.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/external_api.html#transaction
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Single-section precise question (external_api "Transaction"). Expected high MRR; the
      answer is a clear "no" plus the documented workaround.

  - id: q13
    category: covered
    question: >-
      Necesito cambiar el comportamiento de un método de un componente OWL estándar de Odoo
      sin copiar su código. ¿Cómo uso `patch` y qué cuidados debo tener?
    question_en: >-
      I need to change the behavior of a method of a standard Odoo OWL component without
      copying its code. How do I use `patch` and what should I be careful about?
    expected_answer: >-
      Se importa `patch` de `@web/core/utils/patch` y se llama `patch(objToPatch, extension)`,
      que modifica el objeto o clase en el sitio y devuelve una función para quitar el parche.
      Para métodos de una clase (o componente) hay que parchear el `prototype`
      (`patch(MyComponent.prototype, {...})`); parchear la clase misma afecta a propiedades
      estáticas. Dentro de la extensión se accede al original con `super`, que solo funciona en
      métodos (no en `function` ni arrow functions). El constructor no se puede parchear, por
      eso los componentes usan `setup`. Parchear modifica todas las instancias, así que debe
      hacerse lo antes posible, a nivel superior del módulo.
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/patching_code.html#description
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/patching_code.html#patching-a-javascript-class
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/patching_code.html#patching-a-component
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/patching_code.html#removing-a-patch
      - https://www.odoo.com/documentation/19.0/developer/reference/frontend/javascript_reference.html#patching-classes
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      Frontend: patching_code reference + javascript_reference (2 docs). The answer must cover
      prototype vs class, `super` limits and the "patch early" warning.

  - id: q14
    category: covered
    question: >-
      ¿Cómo marco como traducibles los mensajes de error que lanzo desde Python y cuál es la
      forma correcta de meter variables dentro del texto?
    question_en: >-
      How do I mark the error messages I raise from Python as translatable, and what is the
      correct way to include variables in the text?
    expected_answer: >-
      Envolviendo un literal en `self.env._("...")` (o el antiguo `_` de `odoo.tools`); en
      JavaScript, `_t()`. Solo se pueden marcar literales, no expresiones ni variables. Las
      variables se pasan como parámetros de la función: `_("Record %s cannot be modified!",
      record)`, no formateando antes (`_("..." % record)` no funciona) ni después
      (`_("...") % record` pierde el fallback). No se debe partir una frase en varios bloques
      concatenados. `_()` no sirve para traducir valores de campos: para eso se usa el flag
      `translate` del campo. Para cadenas a nivel de módulo existe la versión perezosa
      `LazyTranslate` (`_lt`).
    relevant_sections:
      - https://www.odoo.com/documentation/19.0/developer/howtos/translations.html#explicit-exports
      - https://www.odoo.com/documentation/19.0/developer/howtos/translations.html#variables
      - https://www.odoo.com/documentation/19.0/developer/howtos/translations.html#blocks
      - coding_guidelines.pdf#page=17
      - coding_guidelines.pdf#page=18
    expected_agent: docs
    expects_rewrite: false
    notes: >-
      translations how-to + coding guidelines PDF ("Use translation method correctly", pages
      17-18). Web and PDF chunks both relevant; tests mixed citation formats.

