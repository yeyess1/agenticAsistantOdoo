[project]
name = "odoo-rag-eval"
version = "0.1.0"
description = "Evaluation runner: golden set, deterministic metrics and LLM judges (D-12, Phase 4)"
requires-python = ">=3.12"
dependencies = ["odoo-rag-common", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics", "runners"]
