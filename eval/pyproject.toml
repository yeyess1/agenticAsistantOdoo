[project]
name = "odoo-rag-eval"
version = "0.1.0"
description = "Evaluation runner (golden set, metrics). Skeleton: implemented in Phase 4."
requires-python = ">=3.12"
dependencies = ["odoo-rag-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrics", "runners"]
